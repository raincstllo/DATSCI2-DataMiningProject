<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to main content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/">
      @if (!logoMissing()) {
        <img class="logo" src="logo.jpg" alt="" width="44" height="44" (error)="logoMissing.set(true)" />
      }
      <span class="brand-name">Atiwag Dental Care</span>
    </a>
    @if (auth.isLoggedIn()) {
      <nav class="main-nav" aria-label="Main">
        <ul>
          @for (item of nav; track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: item.path === '/' }"
                ariaCurrentWhenActive="page"
              >
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  @switch (item.icon) {
                    @case ('home') {
                      <path d="M3.5 10.5 12 3.5l8.5 7" />
                      <path d="M5.5 9v11.5h13V9" />
                      <path d="M10 20.5v-6h4v6" />
                    }
                    @case ('patients') {
                      <circle cx="9" cy="8" r="3.5" />
                      <path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5" />
                      <path d="M15.5 4.7a3.5 3.5 0 0 1 0 6.6" />
                      <path d="M18 14.9c1.8.9 2.9 2.6 3.5 5.1" />
                    }
                    @case ('visits') {
                      <rect x="3.5" y="5" width="17" height="15.5" rx="1" />
                      <path d="M3.5 10h17M8 3v4M16 3v4" />
                      <path d="m9 15 2 2 4-4" />
                    }
                    @case ('followups') {
                      <path
                        d="M5.6 3.5h3l1.6 4.2-2 1.4a10.5 10.5 0 0 0 6.7 6.7l1.4-2 4.2 1.6v3a1.6 1.6 0 0 1-1.7 1.6A16.5 16.5 0 0 1 4 5.2a1.6 1.6 0 0 1 1.6-1.7z"
                      />
                    }
                    @case ('revenue') {
                      <rect x="2.5" y="6" width="19" height="12" rx="1" />
                      <circle cx="12" cy="12" r="2.6" />
                      <path d="M6 10v4M18 10v4" />
                    }
                    @case ('analysis') {
                      <path d="M3.5 20.5h17" />
                      <path d="M7 17v-5M12 17V6.5M17 17V9.5" />
                    }
                  }
                </svg>
                <span>{{ item.label }}</span>
              </a>
            </li>
          }
        </ul>
      </nav>
      <button type="button" class="logout" (click)="auth.logout()">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M9.5 3.5h-5v17h5" />
          <path d="m15 8 4 4-4 4" />
          <path d="M19 12H9" />
        </svg>
        <span>Log out</span>
      </button>
    }
  </div>
</header>

<main id="main" tabindex="-1">
  <div role="status" aria-live="polite">
    @if (flash.message(); as message) {
      <p class="alert alert-success flash">
        <span>{{ message }}</span>
        <button type="button" class="btn btn-secondary btn-small" (click)="flash.clear()">
          Dismiss
        </button>
      </p>
    }
  </div>
  <router-outlet />
</main>
