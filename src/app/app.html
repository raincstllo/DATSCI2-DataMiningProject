<a class="skip-link" href="#main" (click)="skipToMain($event)">Skip to main content</a>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" routerLink="/">
      @if (!logoMissing()) {
        <img class="logo" src="logo.jpg" alt="" width="44" height="44" (error)="logoMissing.set(true)" />
      }
      <span>Atiwag Dental Care</span>
    </a>
    @if (auth.isLoggedIn()) {
      <nav aria-label="Main">
        <ul>
          <li>
            <a
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              ariaCurrentWhenActive="page"
              >Home</a
            >
          </li>
          <li>
            <a routerLink="/patients" routerLinkActive="active" ariaCurrentWhenActive="page">Patients</a>
          </li>
          <li>
            <a routerLink="/visits" routerLinkActive="active" ariaCurrentWhenActive="page">Visits</a>
          </li>
          <li>
            <a
              routerLink="/retention"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              >Follow-ups</a
            >
          </li>
          <li>
            <a routerLink="/revenue" routerLinkActive="active" ariaCurrentWhenActive="page"
              >Revenue</a
            >
          </li>
          <li>
            <a routerLink="/analysis" routerLinkActive="active" ariaCurrentWhenActive="page"
              >Analysis details</a
            >
          </li>
        </ul>
      </nav>
      <button type="button" class="btn btn-secondary" (click)="auth.logout()">Log out</button>
    }
  </div>
</header>

<main id="main" tabindex="-1">
  <div role="status" aria-live="polite">
    @if (flash.message(); as message) {
      <p class="alert alert-success flash">
        <span>{{ message }}</span>
        <button type="button" class="btn btn-secondary btn-small" (click)="flash.clear()">
          Dismiss
        </button>
      </p>
    }
  </div>
  <router-outlet />
</main>
